apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: platform
spec:
  groups:
    - name: platform.rules
      interval: 30s
      rules:
        - alert: HighCPUUsage
          expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage on {{ $labels.instance }}"
            description: "CPU usage has been above 80% for 10 minutes."

        - alert: HighMemoryUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.instance }}"
            description: "Available memory is below 15%."

        - alert: PodRestartLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="platform"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is restarting repeatedly"
            description: "Container {{ $labels.container }} restarted more than 3 times in 15 minutes."

        - alert: TargetDown
          expr: up{job="platform-api"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Target {{ $labels.instance }} is down"
            description: "A platform-api target has been unreachable for 5 minutes."

        - alert: RDSHighConnections
          expr: aws_rds_database_connections_average > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "RDS connection count is high"
            description: "Database connections are above 80. Check the application pool."
